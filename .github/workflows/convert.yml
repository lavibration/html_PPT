name: Generate PPTX

on:
  repository_dispatch:
    types: [generate_pptx]
  workflow_dispatch:
    inputs:
      html_content:
        description: 'HTML code to convert'
        required: true
        default: '<h1>Test Slide</h1>'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Conversion Script
        env:
          CLIENT_PAYLOAD_HTML: ${{ github.event.client_payload.html_content || github.event.inputs.html_content }}
        run: |
          python script.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Presentation
          path: presentation.pptx
          retention-days: 1

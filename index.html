<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur HTML vers PPTX</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs/dist/pptxgen.bundle.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-gray-800 text-center">Convertisseur HTML vers PowerPoint</h1>

        <div class="mb-4">
            <label for="htmlInput" class="block text-sm font-medium text-gray-700 mb-2">Collez votre code HTML ici :</label>
            <textarea id="htmlInput" class="w-full h-64 p-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 font-mono text-sm" placeholder="<section class='slide'><h1>Mon Titre</h1><p>Mon texte</p></section>"></textarea>
        </div>

        <div class="flex justify-center mb-6">
            <button id="generateBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                Générer le PPTX
            </button>
        </div>

        <div class="mt-8 border-t pt-6">
            <h2 class="text-lg font-semibold mb-3 text-gray-700">Prévisualisation (Simple)</h2>
            <div id="previewArea" class="border border-dashed border-gray-400 p-4 min-h-[100px] bg-gray-50 rounded-md prose max-w-none">
                <p class="text-gray-500 italic">La prévisualisation apparaîtra ici...</p>
            </div>
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const htmlInput = document.getElementById('htmlInput');
        const previewArea = document.getElementById('previewArea');

        // Update preview as user types
        htmlInput.addEventListener('input', () => {
            previewArea.innerHTML = htmlInput.value;
        });

        generateBtn.addEventListener('click', () => {
            const htmlCode = htmlInput.value.trim();
            if (!htmlCode) {
                alert('Veuillez coller du code HTML d\'abord.');
                return;
            }

            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlCode, 'text/html');

            // Find slides: <section> or <div> with class "slide"
            let slidesElements = Array.from(doc.querySelectorAll('section, div.slide'));

            // If no slide-specific elements found, try to use the whole body if it contains anything
            if (slidesElements.length === 0 && doc.body.innerHTML.trim() !== '') {
                slidesElements = [doc.body];
            }

            if (slidesElements.length === 0) {
                alert('Aucune structure de diapositive trouvée. Utilisez <section> ou <div class="slide">.');
                return;
            }

            const pptx = new PptxGenJS();
            pptx.layout = 'LAYOUT_16x9';

            slidesElements.forEach(slideEl => {
                const slide = pptx.addSlide();

                const defaultFont = 'Calibri';
                let yOffset = 0.5;

                function getHexColor(colorStr) {
                    if (!colorStr) return '000000';
                    if (colorStr.startsWith('#')) return colorStr.substring(1);
                    if (colorStr.startsWith('rgb')) {
                        const parts = colorStr.match(/\d+/g);
                        if (parts && parts.length >= 3) {
                            return parts.slice(0, 3).map(x => parseInt(x).toString(16).padStart(2, '0')).join('');
                        }
                    }
                    return '000000';
                }

                function processNode(node) {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        const tag = node.tagName.toLowerCase();

                        // Ignore some tags
                        if (tag === 'script' || tag === 'style') return;

                        let options = {
                            x: 0.5, y: yOffset, w: '90%', h: 0.3,
                            fontSize: 14, fontFace: defaultFont,
                            color: getHexColor(node.style.color),
                            valign: 'top'
                        };

                        if (node.style.fontWeight === 'bold' || tag === 'b' || tag === 'strong') options.bold = true;
                        if (node.style.fontStyle === 'italic' || tag === 'i' || tag === 'em') options.italic = true;
                        if (node.style.textAlign === 'center') options.align = 'center';
                        if (node.style.textAlign === 'right') options.align = 'right';

                        if (/^h[1-6]$/.test(tag)) {
                            const level = parseInt(tag[1]);
                            options.fontSize = 42 - (level * 5);
                            options.bold = true;
                            options.align = options.align || 'center';
                            options.h = 0.6;
                            const text = node.innerText.trim();
                            if (text) {
                                slide.addText(text, options);
                                yOffset += (options.fontSize / 72) + 0.3;
                            }
                        } else if (tag === 'p' || tag === 'li' || tag === 'span' || tag === 'div') {
                            // For containers, check if they contain ONLY text or inline elements
                            const hasBlockChildren = Array.from(node.children).some(child =>
                                ['p', 'div', 'section', 'article', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'ul', 'ol', 'li'].includes(child.tagName.toLowerCase())
                            );

                            const text = node.innerText.trim();
                            if (text && (!hasBlockChildren || tag === 'p' || tag === 'li')) {
                                options.bullet = tag === 'li' ? { indent: 20 } : false;
                                options.x = tag === 'li' ? 0.75 : 0.5;
                                options.w = tag === 'li' ? '85%' : '90%';
                                slide.addText(text, options);
                                yOffset += (options.fontSize / 72) + 0.15;
                                // If we processed it as a block, don't recurse into children to avoid duplication
                                return;
                            }
                        } else if (tag === 'img') {
                            const src = node.getAttribute('src');
                            if (src) {
                                slide.addImage({ path: src, x: 1, y: yOffset, w: 3, h: 2 });
                                yOffset += 2.2;
                            }
                        }

                        // Recurse into children
                        Array.from(node.childNodes).forEach(processNode);
                    } else if (node.nodeType === Node.TEXT_NODE) {
                        const text = node.textContent.trim();
                        if (text && node.parentNode === slideEl) { // Only direct text nodes of slide element
                            slide.addText(text, {
                                x: 0.5, y: yOffset, w: '90%', h: 0.3,
                                fontSize: 14, fontFace: defaultFont, color: '000000'
                            });
                            yOffset += 0.4;
                        }
                    }
                }

                Array.from(slideEl.childNodes).forEach(processNode);
            });

            pptx.writeFile({ fileName: 'presentation_generee.pptx' })
                .then(fileName => console.log(`Created file: ${fileName}`))
                .catch(err => {
                    console.error(err);
                    alert('Erreur lors de la génération du PPTX.');
                });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to PPTX Converter (GitHub Powered)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slide-preview {
            width: 1280px;
            height: 720px;
            background: white;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transform-origin: top left;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-6 font-sans">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-800">HTML ➔ <span class="text-orange-600">PPTX</span></h1>
            <div class="flex gap-4">
                <input type="text" id="repoPath" placeholder="user/repo" class="px-4 py-2 border rounded-lg text-sm w-48 shadow-sm focus:ring-2 focus:ring-orange-500 outline-none">
                <input type="password" id="ghToken" placeholder="GitHub PAT (repo scope)" class="px-4 py-2 border rounded-lg text-sm w-48 shadow-sm focus:ring-2 focus:ring-orange-500 outline-none">
            </div>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
            <!-- Left: Input & Config -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Code HTML de la Slide</label>
                    <textarea id="htmlContent" class="w-full h-[450px] p-4 font-mono text-xs border rounded-xl focus:ring-2 focus:ring-orange-500 outline-none resize-none" placeholder="<section class='slide p-10'>...</section>"></textarea>
                </div>

                <button id="dispatchBtn" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 active:scale-95 disabled:opacity-50">
                    Générer via GitHub Actions
                </button>
                <p id="statusMsg" class="text-center text-sm font-medium"></p>
            </div>

            <!-- Right: Live Preview -->
            <div class="flex flex-col">
                <h2 class="text-lg font-bold text-slate-700 mb-4">Prévisualisation</h2>
                <div id="previewContainer" class="flex-1 bg-slate-200 rounded-2xl border-2 border-dashed border-slate-300 overflow-hidden relative" style="min-height: 500px;">
                    <div id="previewArea" class="slide-preview scale-[0.3] sm:scale-[0.4] lg:scale-[0.45] xl:scale-[0.5] mx-auto">
                        <div class="p-20 text-center text-slate-400">
                            <p class="text-4xl font-bold italic">Le rendu apparaîtra ici...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const htmlInput = document.getElementById('htmlContent');
        const previewArea = document.getElementById('previewArea');
        const dispatchBtn = document.getElementById('dispatchBtn');
        const statusMsg = document.getElementById('statusMsg');

        // Update preview in real-time
        htmlInput.addEventListener('input', () => {
            previewArea.innerHTML = htmlInput.value || '<div class="p-20 text-center text-slate-400">Rendu vide</div>';
        });

        dispatchBtn.addEventListener('click', async () => {
            const repo = document.getElementById('repoPath').value;
            const token = document.getElementById('ghToken').value;
            const content = htmlInput.value.trim();

            if (!repo || !token || !content) {
                alert("Veuillez remplir tous les champs (Repo, Token et HTML).");
                return;
            }

            dispatchBtn.disabled = true;
            statusMsg.innerText = "⏳ Envoi à GitHub Actions...";
            statusMsg.className = "text-center text-blue-600 font-medium";

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'generate_pptx',
                        client_payload: {
                            html_content: content
                        }
                    })
                });

                if (response.ok) {
                    statusMsg.innerText = "🚀 Succès ! L'Action est lancée. Allez sur GitHub pour télécharger l'Artifact.";
                    statusMsg.className = "text-center text-green-600 font-medium";
                } else {
                    const err = await response.json();
                    throw new Error(err.message || "Erreur lors de l'envoi");
                }
            } catch (error) {
                statusMsg.innerText = "❌ Erreur : " + error.message;
                statusMsg.className = "text-center text-red-600 font-medium";
            } finally {
                dispatchBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
